[package]
name = "spotlight"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/mhorauer/SpotlightGnome"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
gdk_x11 = { version = "0.11.5", package = "gdk4-x11", features = ["xlib"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
